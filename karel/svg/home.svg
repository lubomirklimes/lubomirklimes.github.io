<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40px" height="40px">
  <defs>
    <!-- Gradient pro střechu -->
    <linearGradient id="roofGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <!-- Gradient pro obvod domu -->
    <linearGradient id="wallGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffcc"/>
      <stop offset="100%" stop-color="#ffcc66"/>
    </linearGradient>
  </defs>
  <!-- Základ domu -->
  <rect x="8" y="15" width="24" height="17" fill="url(#wallGradient)" stroke="black" stroke-width="1"/>
  <!-- Střecha -->
  <polygon points="8,15 20,4 32,15" fill="url(#roofGradient)" stroke="black" stroke-width="1"/>
  <!-- Dveře -->
  <rect x="17" y="24" width="6" height="8" fill="#664422" stroke="black" stroke-width="1"/>
  <!-- Klička dveří -->
  <circle cx="22" cy="28" r="0.7" fill="black"/>
  <!-- Volitelná okna -->
  <rect x="12" y="20" width="5" height="5" fill="white" stroke="black" stroke-width="1"/>
  <rect x="23" y="20" width="5" height="5" fill="white" stroke="black" stroke-width="1"/>
</svg>

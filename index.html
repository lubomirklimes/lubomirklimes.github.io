<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Karel - Domovská stránka</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      margin: 1rem;
    }
    h1 {
      margin-bottom: 0.5rem;
      font-size: 2rem;
      color: #333;
    }
    p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background-color: #0078d4;
      color: #fff;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 4px;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Robot Karel</h1>
    <p>Vítejte na stránkách Robot Karel – interaktivní aplikace, která vám umožní programovat a ovládat robota v zábavném prostředí. Prozkoumejte logické úlohy a objevte svět programování!</p>
    <a class="btn" href="karel/">Spustit Karla</a>
  </div>
</body>
</html>
